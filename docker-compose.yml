# Optional local development stack. The app has no external service
# dependencies; this compose file just containers the two dev servers.
#
#   docker compose up
#   backend  → http://localhost:8000
#   frontend → http://localhost:5173
services:
  backend:
    image: python:3.13-slim
    working_dir: /app/backend
    command: >
      sh -c "pip install --quiet fastapi 'pydantic>=2' uvicorn &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
